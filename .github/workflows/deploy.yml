name: Terraform CI

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Manual stage to run"
        required: true
        type: choice
        options:
          - validate
          - plan
          - apply
        default: validate

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_PROFILE: deployment
  TF_VERSION: "1.15.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: ./terraform

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: github.event.inputs.stage == 'validate'

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init without backend
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event.inputs.stage == 'plan' || github.event.inputs.stage == 'apply'
    environment: develop

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile "$AWS_PROFILE"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile "$AWS_PROFILE"
          if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile "$AWS_PROFILE"
          fi
          aws configure set region "$AWS_REGION" --profile "$AWS_PROFILE"

      - name: Create terraform.tfvars
        run: |
          cat <<EOF > terraform.tfvars
          ${{ secrets.TFVARS_FILE }}
          EOF
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Plan
        run: terraform plan -no-color -out=terraform.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload plan
        if: github.event.inputs.stage == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/terraform.tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [plan]
    if: github.event.inputs.stage == 'apply'
    environment: develop

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile "$AWS_PROFILE"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile "$AWS_PROFILE"
          if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile "$AWS_PROFILE"
          fi
          aws configure set region "$AWS_REGION" --profile "$AWS_PROFILE"

      - name: Create terraform.tfvars
        run: |
          cat <<EOF > terraform.tfvars
          ${{ secrets.TFVARS_FILE }}
          EOF
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Apply
        run: terraform apply -auto-approve terraform.tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
